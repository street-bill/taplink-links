<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Capu Kaffebar og Risteri</title>
<style>
  :root { --bg:#f7f6f3; --kort:#fff; --tekst:#1c1c1c; --svag:#6b6b6b; --linje:#e4e2dd; --ok:#1f7a4d;
          --ok-bg:#e7f4ec; --nej:#b3261e; --nej-bg:#fbeceb; --valgt:#1c1c1c; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,system-ui,"Segoe UI",sans-serif; background:var(--bg); color:var(--tekst);
         padding:20px 16px 40px; line-height:1.4; }
  .wrap { max-width:560px; margin:0 auto; }
  header { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:14px; }
  h1 { font-size:1.45rem; }
  .sub { color:var(--svag); font-size:.85rem; margin-top:2px; }
  .sprog { border:1px solid var(--linje); background:var(--kort); border-radius:20px; padding:6px 12px;
           font-size:.85rem; cursor:pointer; white-space:nowrap; color:var(--tekst); }
  .faner { display:flex; gap:6px; background:#ebe8e2; border-radius:12px; padding:4px; margin-bottom:14px; }
  .fane { flex:1; text-align:center; padding:10px 6px; border-radius:9px; font-weight:600; font-size:.95rem;
          cursor:pointer; color:var(--svag); border:0; background:transparent; }
  .fane.on { background:var(--kort); color:var(--tekst); box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .boks { background:var(--kort); border:1px solid var(--linje); border-radius:14px; padding:14px; margin-bottom:14px; }
  .boks h2 { font-size:1rem; margin-bottom:10px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { border:1px solid var(--linje); background:var(--kort); border-radius:20px; padding:8px 12px;
          font-size:.9rem; cursor:pointer; user-select:none; }
  .chip.on { background:var(--valgt); color:#fff; border-color:var(--valgt); }
  .status { font-size:.9rem; color:var(--svag); margin:4px 2px 12px; }
  .kat { font-size:.8rem; text-transform:uppercase; letter-spacing:.06em; color:var(--svag); margin:18px 2px 8px; }
  .ret { background:var(--kort); border:1px solid var(--linje); border-radius:12px; padding:12px 14px; margin-bottom:8px; }
  .ret.nej { background:var(--nej-bg); border-color:#f1c9c6; }
  .ret.ok { border-left:4px solid var(--ok); }
  .top { display:flex; justify-content:space-between; gap:10px; }
  .navn { font-weight:600; }
  .ret.mb { padding:0; overflow:hidden; } .ret.mb .kropp { padding:12px 14px; }
  .rbill { width:100%; aspect-ratio:16/10; object-fit:cover; display:block; background:var(--linje); }
  .pris { font-weight:600; white-space:nowrap; }
  .beskr { color:var(--svag); font-size:.88rem; margin-top:2px; }
  .info { font-size:.85rem; margin-top:6px; }
  .info b { font-weight:600; }
  .smaa { font-size:.78rem; color:var(--svag); margin-top:5px; }
  .maerke { display:inline-block; font-size:.75rem; font-weight:700; border-radius:10px; padding:2px 8px; margin-top:6px; }
  .m-ok { background:var(--ok-bg); color:var(--ok); }
  .m-nej { background:#f4d4d1; color:var(--nej); }
  .m-ukendt { background:#ece9e2; color:var(--svag); }
  .knap { display:block; text-align:center; padding:14px; border-radius:12px; background:var(--valgt); color:#fff;
          text-decoration:none; font-weight:600; margin:8px 0; }
  .knap.lys { background:var(--kort); color:var(--tekst); border:1px solid var(--linje); }
  .orig img { width:100%; border-radius:10px; border:1px solid var(--linje); margin-top:8px; }
  .fod { color:var(--svag); font-size:.8rem; margin-top:22px; text-align:center; }
  .fod a { color:var(--svag); }
  .tom { text-align:center; color:var(--svag); padding:30px 10px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Capu Kaffebar og Risteri</h1><div class="sub" id="opd"></div></div>
    <button class="sprog" id="sprog">English</button>
  </header>
  <div class="faner" id="faner"></div>
  <div id="indhold"></div>
  <div class="fod"><span id="t-spoerg"></span><br><br><span id="t-drevet"></span> <a href="https://taplink.dk">taplink</a></div>
</div>
<script>
var D = {"opdateret": "21.10.2026", "anmeld_url": "https://search.google.com/local/writereview?placeid=ChIJ____BnTOSEYRcteTNnN3iGk", "retter": []};
var A = [["gluten", "Gluten", "Gluten"], ["krebsdyr", "Krebsdyr", "Crustaceans"], ["aeg", "Æg", "Eggs"], ["fisk", "Fisk", "Fish"], ["jordnoedder", "Jordnødder", "Peanuts"], ["soja", "Soja", "Soy"], ["maelk", "Mælk", "Milk"], ["noedder", "Nødder", "Tree nuts"], ["selleri", "Selleri", "Celery"], ["sennep", "Sennep", "Mustard"], ["sesam", "Sesam", "Sesame"], ["svovl", "Sulfitter", "Sulphites"], ["lupin", "Lupin", "Lupin"], ["bloeddyr", "Bløddyr", "Molluscs"]];
var T = {
  da: { menu:"Menukort", allerg:"Allergener", anmeld:"Anmeld os", vaelg:"Jeg tåler ikke:",
        spoerg:"Har du en alvorlig allergi, så spørg altid personalet, før du bestiller.",
        drevet:"Drevet af", opd:"Opdateret", alle:"Vælg dine allergier, så viser vi, hvad du kan spise.",
        passer:"retter passer til dig", ingen:"Ingen retter passer til dine valg - spørg personalet.",
        indeh:"Indeholder", spor:"Kan indeholde spor af", ingenall:"Ingen af de 14 allergener",
        ok:"Passer til dig", nej:"Indeholder noget, du ikke tåler", ukendt:"Ikke oplyst - spørg personalet",
        visnej:"Vis også de {n} retter, du ikke kan spise",
        venter:"Oplysningerne er på vej. Spørg personalet indtil da.", knap:"English",
        orig:"Se det originale menukort", tak:"Tak for besøget! Vil du hjælpe os med en anmeldelse?",
        anmeldknap:"Giv os en anmeldelse" },
  en: { menu:"Menu", allerg:"Allergens", anmeld:"Review us", vaelg:"I can't have:",
        spoerg:"If you have a severe allergy, always ask the staff before ordering.",
        drevet:"Powered by", opd:"Updated", alle:"Select your allergies to see what you can eat.",
        passer:"dishes suit you", ingen:"No dishes match your selection - please ask the staff.",
        indeh:"Contains", spor:"May contain traces of", ingenall:"None of the 14 allergens",
        ok:"Suits you", nej:"Contains something you can't have", ukendt:"Not stated - ask the staff",
        visnej:"Also show the {n} dishes you can't have",
        venter:"Information is on its way. Please ask the staff for now.", knap:"Dansk",
        orig:"See the original menu", tak:"Thanks for visiting! Would you help us with a review?",
        anmeldknap:"Leave us a review" }
};
var sprog = (navigator.language || "da").slice(0,2) === "da" ? "da" : "en";
var fane = (location.hash || "").replace("#","") || D.start || "allerg";
var valgt = {}, visNej = false;
try { valgt = JSON.parse(localStorage.getItem("taplink-allergener") || "{}"); } catch (e) {}
function navn(k) { for (var i=0;i<A.length;i++) if (A[i][0]===k) return sprog==="da" ? A[i][1] : A[i][2]; return k; }
function esc(s) { var d=document.createElement("div"); d.textContent=s||""; return d.innerHTML; }
function grupper(fn) {
  var L = document.createElement("div"), kat = null;
  (D.retter||[]).forEach(function (r) {
    var el = fn(r); if (!el) return;  // 21-10: skjulte retter (passer ikke) - og ingen tom kategori-overskrift
    if (r.kategori && r.kategori !== kat) { kat = r.kategori;
      var h = document.createElement("div"); h.className = "kat"; h.textContent = kat; L.appendChild(h); }
    L.appendChild(el);
  });
  return L;
}
function menu(t) {
  var box = document.createElement("div");
  if (!(D.retter||[]).length && !(D.originaler||[]).length) { box.innerHTML = '<div class="tom">' + t.venter + "</div>"; return box; }
  box.appendChild(grupper(function (r) {
    var el = document.createElement("div"); el.className = "ret";
    var smaa = r.oplyst ? ((r.allergener||[]).length ? r.allergener.map(navn).join(" · ") : t.ingenall) : t.ukendt;
    el.innerHTML = '<div class="top"><div class="navn">' + esc(r.navn) + '</div>' + (r.pris ? '<div class="pris">' + esc(r.pris) + "</div>" : "")
      + "</div>" + (r.beskrivelse ? '<div class="beskr">' + esc(r.beskrivelse) + "</div>" : "") + '<div class="smaa">' + smaa + "</div>";
    return el;
  }));
  (D.originaler||[]).forEach(function (f, i) {
    var o = document.createElement("div"); o.className = "orig";
    o.innerHTML = /\.(png|jpe?g|webp|gif)$/i.test(f) ? '<img src="' + f + '" alt="menu">' :
      '<a class="knap lys" href="' + f + '" target="_blank" rel="noopener">' + t.orig + (D.originaler.length > 1 ? " " + (i+1) : "") + "</a>";
    box.appendChild(o);
  });
  return box;
}
function allerg(t) {
  var box = document.createElement("div");
  var b = document.createElement("div"); b.className = "boks";
  b.innerHTML = "<h2>" + t.vaelg + '</h2><div class="chips"></div>';
  A.forEach(function (a) {
    var c = document.createElement("span"); c.className = "chip" + (valgt[a[0]] ? " on" : ""); c.textContent = navn(a[0]);
    c.onclick = function () { valgt[a[0]] = !valgt[a[0]]; visNej = false;
      try { localStorage.setItem("taplink-allergener", JSON.stringify(valgt)); } catch (e) {} tegn(); };
    b.querySelector(".chips").appendChild(c);
  });
  box.appendChild(b);
  var st = document.createElement("div"); st.className = "status"; box.appendChild(st);
  if (!(D.retter||[]).length) { box.insertAdjacentHTML("beforeend", '<div class="tom">' + t.venter + "</div>"); return box; }
  var aktive = Object.keys(valgt).filter(function (k) { return valgt[k]; }), passer = 0, skjult = 0;
  box.appendChild(grupper(function (r) {
    var rammer = aktive.filter(function (k) { return (r.allergener||[]).indexOf(k) >= 0 || (r.kan_indeholde||[]).indexOf(k) >= 0; });
    var tilst = !r.oplyst ? "ukendt" : (rammer.length ? "nej" : "ok");
    if (tilst === "ok") passer++;
    if (tilst === "nej" && !visNej) { skjult++; return null; }  // gæsten ser først det, de KAN spise (21-10)
    var el = document.createElement("div");
    el.className = "ret" + (r.billede ? " mb" : "") + (aktive.length ? (tilst === "nej" ? " nej" : (tilst === "ok" ? " ok" : "")) : "");
    var info = !r.oplyst ? "" : "<b>" + t.indeh + ":</b> " + ((r.allergener||[]).length ? r.allergener.map(navn).join(", ") : t.ingenall);
    if (r.oplyst && (r.kan_indeholde||[]).length) info += "<br><b>" + t.spor + ":</b> " + r.kan_indeholde.map(navn).join(", ");
    var m = !aktive.length ? (r.oplyst ? "" : '<span class="maerke m-ukendt">' + t.ukendt + "</span>")
          : '<span class="maerke m-' + tilst + '">' + t[tilst] + "</span>";
    // 21-10 (Thomas: "menukortet og allergener er jo ens"): ÉN liste med billede, pris og beskrivelse
    var krop = '<div class="top"><div class="navn">' + esc(r.navn) + '</div>' + (r.pris ? '<div class="pris">' + esc(r.pris) + "</div>" : "") + "</div>"
      + (r.beskrivelse ? '<div class="beskr">' + esc(r.beskrivelse) + "</div>" : "") + (info ? '<div class="info">' + info + "</div>" : "") + m;
    el.innerHTML = (r.billede ? '<img class="rbill" loading="lazy" src="' + esc(r.billede) + '" alt="' + esc(r.navn) + '">' : "")
      + (r.billede ? '<div class="kropp">' + krop + "</div>" : krop);
    return el;
  }));
  st.textContent = aktive.length ? (passer ? passer + " " + t.passer : t.ingen) : t.alle;
  (D.originaler||[]).forEach(function (f, i) {
    var o = document.createElement("div"); o.className = "orig";
    o.innerHTML = '<a class="knap lys" href="' + f + '" target="_blank" rel="noopener">' + t.orig + (D.originaler.length > 1 ? " " + (i+1) : "") + "</a>";
    box.appendChild(o);
  });
  if (skjult) { var vb = document.createElement("button"); vb.className = "sprog"; vb.style.marginTop = "6px";
    vb.textContent = t.visnej.replace("{n}", skjult); vb.onclick = function () { visNej = true; tegn(); }; box.appendChild(vb); }
  return box;
}
function anmeld(t) {
  var box = document.createElement("div"); box.className = "boks";
  box.innerHTML = "<h2>" + t.tak + '</h2><a class="knap" href="' + D.anmeld_url + '" target="_blank" rel="noopener">' + t.anmeldknap + "</a>";
  return box;
}
function tegn() {
  var t = T[sprog];
  if (D.lukket) {  // abonnementet er ikke betalt - siden er midlertidigt lukket
    document.getElementById("faner").innerHTML = "";
    document.getElementById("indhold").innerHTML = '<div class="tom">' + (sprog === "da"
      ? "Siden er midlertidigt lukket. Spørg personalet om allergener." : "This page is temporarily closed. Please ask the staff about allergens.") + "</div>";
    return;
  }
  document.documentElement.lang = sprog;
  document.getElementById("sprog").textContent = t.knap;
  document.getElementById("t-spoerg").textContent = t.spoerg;
  document.getElementById("t-drevet").textContent = t.drevet;
  document.getElementById("opd").textContent = D.opdateret ? t.opd + " " + D.opdateret : "";
  var faner = [["allerg", t.allerg]].concat(D.anmeld_url ? [["anmeld", t.anmeld]] : []);  // 21-10: Menukort-fanen er lagt sammen med Allergener
  if (!faner.some(function (f) { return f[0] === fane; })) fane = "allerg";
  var F = document.getElementById("faner"); F.innerHTML = "";
  faner.forEach(function (f) {
    var b = document.createElement("button"); b.className = "fane" + (f[0] === fane ? " on" : ""); b.textContent = f[1];
    b.onclick = function () { fane = f[0]; history.replaceState(null, "", "#" + fane); tegn(); };
    F.appendChild(b);
  });
  var I = document.getElementById("indhold"); I.innerHTML = "";
  I.appendChild(fane === "menu" ? menu(t) : fane === "anmeld" ? anmeld(t) : allerg(t));
}
document.getElementById("sprog").onclick = function () { sprog = sprog === "da" ? "en" : "da"; tegn(); };
tegn();
</script>
</body>
</html>
