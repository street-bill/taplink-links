<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>RM Autoteknik</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, system-ui, sans-serif; background: #111;
           color: #fff; min-height: 100vh; display: flex; align-items: center;
           justify-content: center; padding: 24px; }
    .card { width: 100%; max-width: 420px; text-align: center; }
    h1 { font-size: 1.6rem; margin-bottom: 6px; }
    p { color: #aaa; margin-bottom: 28px; }
    a.btn { display: block; padding: 18px; margin-bottom: 14px; border-radius: 12px;
            text-decoration: none; font-size: 1.1rem; font-weight: 600; color: #111;
            background: #fff; }
    a.btn.primary { background: #4b8bf5; color: #fff; }
    .foot { margin-top: 30px; color: #555; font-size: .8rem; }
    .foot a { color: #555; }
  </style>
</head>
<body>
  <div class="card">
    <h1>RM Autoteknik</h1>
    <p>Tak for besøget - hvad kan vi hjælpe med?</p>
    <a class="btn primary" href="https://search.google.com/local/writereview?placeid=ChIJN3pYSApUUkYR2jixW7-4amg">⭐ Anmeld os på Google</a>
    <a class="btn" href="https://dk.trustpilot.com/evaluate/www.rmautoteknik.dk">💬 Anmeld os på Trustpilot</a>
    <a class="btn" href="http://service.automester.dk/book-tid?workshop=23336413">🔧 Book tid til værksted</a>
    <div class="foot">Drevet af <a href="https://taplink.dk">taplink</a></div>
  </div>
  <script>
    // Anonym tælling (ingen personhenførbare data): 1 tap = 1 sidevisning.
    (function () {
      var b = "";
      if (!b) return;
      var send = function (t) {
        try { navigator.sendBeacon(b + "/api/tap/rm-autoteknik?t=" + t); } catch (e) {}
      };
      send("view");
      document.querySelectorAll("a.btn").forEach(function (a, i) {
        a.addEventListener("click", function () { send("klik" + i); });
      });
    })();
  </script>
</body>
</html>
